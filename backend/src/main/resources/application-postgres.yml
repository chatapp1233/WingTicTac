# Real PostgreSQL profile - used by docker-compose and any real deployment.
# Activate with SPRING_PROFILES_ACTIVE=postgres
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chatapp}
    username: ${DATABASE_USERNAME:chatapp}
    password: ${DATABASE_PASSWORD:chatapp}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.chatapp.backend: INFO
