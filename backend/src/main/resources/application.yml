spring:
  application:
    name: chat-app-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Override JWT_SECRET in any real deployment - this default is for local dev only.
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-me-1234567890abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    # We intentionally provide both a UserDetailsService (for the JWT filter) and an
    # explicit AuthenticationProvider (for login) - Spring Security's benign warning
    # about that combination isn't actionable, so it's quieted per its own suggestion.
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
